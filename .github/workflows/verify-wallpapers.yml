name: Verify Wallpaper Cask Checksums

on:
  pull_request:
    paths:
      - "Casks/*wallpapers*.rb"
      - "scripts/verify-wallpapers.py"
      - ".github/workflows/verify-wallpapers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Verify wallpaper cask checksums
        run: python3 scripts/verify-wallpapers.py
